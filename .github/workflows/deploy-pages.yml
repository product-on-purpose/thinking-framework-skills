name: Deploy docs site to GitHub Pages

# The Astro Starlight docs site lives in site/ and is a GENERATED VIEW of the
# skills (npm run build runs scripts/gen-site.mjs, then astro build).
#
# At go-public: GitHub Pages is enabled (source "GitHub Actions") and this
# deploys on every push to main, plus manual runs. Before Pages was enabled this
# was workflow_dispatch only, since a push trigger would have failed with no Pages
# target. Verify the /thinking-framework-skills base path against the live URL.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build site (gen-site.mjs + astro build)
        id: build
        run: npm run build
        env:
          # Set the PUBLIC_GA_ID repository variable (Settings -> Secrets and variables ->
          # Actions -> Variables) to enable GA4 on the deployed site. astro.config.mjs injects
          # gtag only when this is non-empty, so an unset variable means no tracking at all
          # (local and PR builds never get it). This is the measurement half of the feedback loop.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      # Link/route integrity guards (clause 14.11) on the DEPLOY build, so the artifact that ships
      # is guarded, not only the PR build. Gated on the build step's outcome; a guard failure stops
      # the upload and deploy. Same three guards as the PR `site-build` job in ci.yml.
      - name: Check rendered links in dist (clause 14.11a)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node ../scripts/check-rendered-links.mjs dist
        env:
          STRICT_ANCHORS: '1'

      - name: Check route parity against the committed manifest (clause 14.11b)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node ../scripts/check-route-parity.mjs dist

      - name: Check mermaid diagrams in generated site content
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node ../scripts/check-mermaid.mjs src/content/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
