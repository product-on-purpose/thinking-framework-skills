# Rich sidecar for the tfs-problem-restatement skill.
# DRAFT shape; reconciles with agent-skills-toolkit conventions later.
# A hand-authored summary of evidence/dossier.md (the source of truth).

identity:
  id: thinking-framework-skills.problem-restatement
  slug: problem-restatement
  name: tfs-problem-restatement
  display_name: Problem Restatement
  version: 0.1.0
  status: draft
  maturity: alpha

classification:
  primary_family: problem-framing
  secondary_families: [perspective-and-multi-lens]
  thinking_modes: [divergent, critical, lateral]
  problem_contexts: [high-ambiguity, high-stakes]
  use_cases:
    - reframe an ambiguous problem or a symptom before solving it
    - separate the user's actual goal from a proposed implementation
    - open a reframing, discovery, or strategy workflow with a sound problem
  poor_fit_cases:
    - the problem is already well-defined and validated
    - trivial or fully reversible tasks where a wrong frame costs little
    - generating solutions (use an ideation skill) or choosing among them (use a decision skill)
    - endless reframing that never selects a working frame

interface:
  required_inputs:
    - a problem statement, request, or symptom to reframe
  optional_inputs:
    - the stated goal or constraints
    - the key stakeholders
  primary_artifact_type: problem-frame-set
  output_formats: [markdown-table]

execution:
  mode: inline
  subagent_suitable: false
  recipe_suitable: true
  likely_companions:
    - thinking-framework-skills.evidence-vs-inference-sort
    - thinking-framework-skills.scamper
    - thinking-framework-skills.premortem

relationships:
  often_follows: []
  often_precedes:
    - thinking-framework-skills.evidence-vs-inference-sort
    - thinking-framework-skills.scamper
    - thinking-framework-skills.decision-option-review
  complements:
    - thinking-framework-skills.parallel-perspectives-review
  overlaps_with: []
  variants: []

quality:
  trigger_eval_status: not-run
  output_eval_status: not-run
  known_failure_modes:
    - cosmetic restatements that do not shift altitude, stakeholder, or goal-vs-implementation
    - never converging on a single chosen working frame
    - drifting to a convenient frame rather than the user's actual goal

evidence:
  evidence_tier: "M/P"
  confidence: high that framing affects outcomes; moderate that "restate N ways" is the best operationalization
  transferred_evidence: true
  lineage:
    derived_from: [design-thinking define mode, problem-finding research, reframing practice]
  source_dossier: evidence/dossier.md
  attribution_required: false
  trademark: none

implementation:
  skill_path: skills/tfs-problem-restatement/SKILL.md
  references_path: skills/tfs-problem-restatement/references/
  evidence_path: skills/tfs-problem-restatement/evidence/dossier.md
  evals_path: skills/tfs-problem-restatement/eval/
